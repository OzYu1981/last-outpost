<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>末日防線 · 流程測試版</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030708;color:#e3eae4;font-family:system-ui,sans-serif}body{display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#stage{position:relative;width:0;height:0;background:#091014;box-shadow:0 0 100px #182b2533}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;text-align:center;background:#091014}h1{font-size:32px;color:#f4bb51}p{color:#a3b3ad;font-size:14px;line-height:1.8}progress{width:80%;accent-color:#f4bb51;height:6px}#error{white-space:pre-wrap;color:#f0aaa0}#flow-state{display:none}
</style></head><body><main id="stage"><canvas id="unity-canvas" tabindex="0" aria-label="末日防線直式遊戲"></canvas><div id="loading"><p>LAST OUTPOST</p><h1>末日防線</h1><p>正在載入流程測試版</p><progress id="progress" max="1" value="0"></progress><p id="percent">0%</p><p id="error"></p></div></main><output id="flow-state"></output>
<script>
const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading');
// One common 9:16 scale from the available content box, after ALL safe-area insets.
function fitPortrait(width,height){const w=Math.max(0,Math.min(width,height*9/16));return {width:w,height:w*16/9};}
function resizeStage(){const style=getComputedStyle(document.body),rect=document.body.getBoundingClientRect();const availableWidth=rect.width-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight),availableHeight=rect.height-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);const size=fitPortrait(availableWidth,availableHeight);const stage=document.getElementById('stage');stage.style.width=size.width+'px';stage.style.height=size.height+'px';}
new ResizeObserver(resizeStage).observe(document.body);window.addEventListener('resize',resizeStage);resizeStage();
const script=document.createElement('script');script.src='Build/Web.loader.js';
script.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/Web.data',frameworkUrl:'Build/Web.framework.js',codeUrl:'Build/Web.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'Prototype Lab',productName:'Last Outpost',productVersion:'0.3.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),showBanner:(message,type)=>{if(type==='error')document.getElementById('error').textContent=message;}},value=>{document.getElementById('progress').value=value;document.getElementById('percent').textContent=Math.round(value*100)+'%';}).then(instance=>{window.gameInstance=instance;loading.style.display='none';canvas.focus();}).catch(error=>document.getElementById('error').textContent=String(error));
script.onerror=()=>document.getElementById('error').textContent='載入失敗，請使用本機啟動工具開啟遊戲。';document.body.appendChild(script);
</script></body></html>
